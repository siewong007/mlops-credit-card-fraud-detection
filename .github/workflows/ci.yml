name: CI
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      DISABLE_PANDERA_IMPORT_WARNING: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fast unit tests
        run: make test-fast

      - name: Fetch real dataset (OpenML)
        run: make fetch-data

      - name: DVC clean-clone reproduction
        run: |
          export DVC_REPRO_EXPORT_DIR="$GITHUB_WORKSPACE/dvc-repro"
          DVC_REPRO_DATA_MODE=real make verify-dvc

      - name: Complete verification
        run: SOURCE_COMMIT="$GITHUB_SHA" make verify

      - name: Evidence consistency
        run: python -m pytest -q tests/test_evidence_consistency.py

      - name: Upload successful evidence
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          # Every path stays inside the workspace so the artifact is rooted there.
          # Mixing in an absolute path pushes the least common ancestor up to
          # /home/runner/work and buries the evidence under a deep nested tree.
          path: |
            reports/*.json
            reports/trigger_log.md
            reports/figures/**
            reports/drift/**
            site/**
            dvc.yaml
            dvc.lock
            params.yaml
            requirements.txt
            dvc-repro/**

  # The README documents a Windows setup path that no Linux job can exercise.
  # Windows-only breakage — locale-codepage decoding, absent POSIX tools,
  # backslash paths — otherwise reaches contributors unverified.
  windows:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      DISABLE_PANDERA_IMPORT_WARNING: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: pip
      - run: pip install -r requirements.txt

      # The suite shells out to `make` to assert the gate order, and Windows
      # runners ship without it. Chocolatey provides the same GNU make the
      # README tells Windows contributors to install via conda-forge.
      - name: Install GNU make
        run: choco install make --no-progress --yes

      - name: Fast unit tests
        run: make test-fast

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build immutable verification image
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" \
            --tag fraud-mlops:verify .

      - name: Assert exact Python runtime
        run: |
          test "$(docker run --rm --entrypoint python fraud-mlops:verify --version)" \
            = "Python 3.13.9"

      - name: Run shared verification contract
        run: docker run --rm fraud-mlops:verify make fetch-data verify
