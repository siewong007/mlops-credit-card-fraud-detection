name: Scheduled monitoring

# The pipeline is a *batch* system, so a scheduled run is a far more faithful
# simulation of production than a hosted API would be: new batches are scored,
# drift and performance are recomputed, the retraining trigger is evaluated, and
# the resulting evidence is published as a dashboard.
on:
  schedule:
    - cron: "0 6 * * 1"      # every Monday 06:00 UTC
  workflow_dispatch:          # manual run (used for the live demo)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      DISABLE_PANDERA_IMPORT_WARNING: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch real dataset (OpenML)
        run: make fetch-data

      - name: Run verified monitoring simulation
        run: SOURCE_COMMIT="$GITHUB_SHA" make verify

      - name: Parse structured review decision
        id: decision
        run: |
          python -m src.retrain_trigger \
            --github-annotation reports/trigger_decisions.json
          status="$(python -c 'import json; print(json.load(open("reports/trigger_decisions.json"))["overall_status"])')"
          case "$status" in
            ok|warning|retrain) ;;
            *) echo "Unknown monitoring status: $status" >&2; exit 1 ;;
          esac
          echo "overall_status=$status" >> "$GITHUB_OUTPUT"

      - name: Publish decision to run summary
        run: |
          {
            echo "## Monitoring run"
            echo
            echo "Dataset: **real ULB (OpenML 1597)**"
            echo
            echo "Overall status: **${{ steps.decision.outputs.overall_status }}**"
            echo
            cat reports/trigger_log.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload successful evidence
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-evidence
          path: |
            reports/*.json
            reports/trigger_log.md
            reports/figures/**
            reports/drift/**
            site/**

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
