data:
  raw_path: data/raw/creditcard.csv
  batch_dir: data/batches
  # Time-based split fractions (no random-only splitting)
  train_frac: 0.5
  valid_frac: 0.2
  n_prod_batches: 3
train:
  model: logistic_regression   # or: xgboost
  class_weight: balanced
  random_state: 42
threshold:
  # business costs used for cost-based threshold selection
  cost_false_negative: 100
  cost_false_positive: 1
trigger:
  pr_auc_drop_pct: 10        # retrain if PR-AUC drops >10% vs validation baseline
  recall_floor: 0.75         # retrain if recall below floor
  drifted_features_pct: 30   # retrain if >30% of features drift
