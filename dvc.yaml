stages:
  data:
    cmd: python -m src.simulate_data
    deps:
      - src/simulate_data.py
      - src/config.py
      - src/evidence.py
    params:
      - simulate
      - data.raw_path
    outs:
      - data/raw/creditcard.csv
      - data/raw/PROVENANCE.json

  validate:
    cmd: python -m src.validate
    deps:
      - src/validate.py
      - src/ingest.py
      - src/config.py
      - src/evidence.py
      - data/raw/creditcard.csv
    params:
      - data
    outs:
      - reports/validation_report.json:
          cache: false

  ingest:
    cmd: python -m src.ingest
    deps:
      - src/ingest.py
      - src/validate.py
      - src/config.py
      - src/evidence.py
      - reports/validation_report.json
      - data/raw/creditcard.csv
    params:
      - data
    outs:
      - data/batches/train.csv
      - data/batches/model_valid.csv
      - data/batches/calibration.csv
      - data/batches/prod_1.csv
      - data/batches/prod_2.csv
      - data/batches/prod_3.csv

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - src/features.py
      - src/evaluate.py
      - src/config.py
      - src/evidence.py
      - data/batches/train.csv
      - data/batches/model_valid.csv
      - data/raw/creditcard.csv
      - data/raw/PROVENANCE.json
      - params.yaml
    outs:
      - models/model.joblib
      - models/scaler.joblib
      - reports/experiment_comparison.json:
          cache: false
      - reports/promotion_record.json:
          cache: false

  threshold:
    cmd: python -m src.threshold
    deps:
      - src/threshold.py
      - src/artifacts.py
      - src/features.py
      - src/evaluate.py
      - src/validate.py
      - src/config.py
      - src/evidence.py
      - models/model.joblib
      - models/scaler.joblib
      - reports/promotion_record.json
      - data/batches/calibration.csv
    params:
      - threshold
    outs:
      - models/threshold.json
      - reports/operating_point.json:
          cache: false
    plots:
      - reports/figures/threshold_tradeoff.png:
          cache: false

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/artifacts.py
      - src/features.py
      - src/validate.py
      - src/config.py
      - src/evidence.py
      - models/model.joblib
      - models/scaler.joblib
      - models/threshold.json
      - data/batches/calibration.csv
    metrics:
      - reports/metrics_default.json:
          cache: false
      - reports/metrics_operating.json:
          cache: false
    plots:
      - reports/figures/confusion_matrix_default.png:
          cache: false
      - reports/figures/confusion_matrix_operating.png:
          cache: false
      - reports/figures/pr_curve.png:
          cache: false

  inference:
    cmd: python -m src.batch_inference
    deps:
      - src/batch_inference.py
      - src/artifacts.py
      - src/features.py
      - src/validate.py
      - src/config.py
      - src/evidence.py
      - models/model.joblib
      - models/scaler.joblib
      - models/threshold.json
      - reports/promotion_record.json
      - data/batches/prod_1.csv
      - data/batches/prod_2.csv
      - data/batches/prod_3.csv
    outs:
      - data/batches/preds_prod_1.csv
      - data/batches/preds_prod_2.csv
      - data/batches/preds_prod_3.csv

  drift:
    cmd: python -m src.drift
    deps:
      - src/drift.py
      - src/artifacts.py
      - src/features.py
      - src/evaluate.py
      - src/validate.py
      - src/config.py
      - src/evidence.py
      - models/model.joblib
      - models/scaler.joblib
      - models/threshold.json
      - data/batches/train.csv
      - data/batches/calibration.csv
      - data/batches/prod_1.csv
      - data/batches/prod_2.csv
      - data/batches/prod_3.csv
      - data/batches/preds_prod_1.csv
      - data/batches/preds_prod_2.csv
      - data/batches/preds_prod_3.csv
    params:
      - drift
      - threshold
    outs:
      - reports/drift/prod_1.json:
          cache: false
      - reports/drift/prod_2.json:
          cache: false
      - reports/drift/prod_3.json:
          cache: false
    metrics:
      - reports/drift_summary.json:
          cache: false
    plots:
      - reports/figures/psi_prod_1.png:
          cache: false
      - reports/figures/psi_prod_2.png:
          cache: false
      - reports/figures/psi_prod_3.png:
          cache: false

  trigger:
    cmd: python -m src.retrain_trigger
    deps:
      - src/retrain_trigger.py
      - src/config.py
      - src/evidence.py
      - reports/drift_summary.json
      - reports/operating_point.json
    params:
      - trigger
    outs:
      - reports/trigger_decisions.json:
          cache: false
      - reports/trigger_log.md:
          cache: false
